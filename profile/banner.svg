<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="160" viewBox="0 0 1300 160">
  <defs>
    <!-- Индивидуальное свечение для каждой буквы -->
    <filter id="glowLetter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Усиленное свечение для каждой буквы (пик анимации) -->
    <filter id="glowLetterStrong" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feGaussianBlur stdDeviation="28" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Первая строка текста -->
  <g filter="url(#glowLetter)">
    <text x="650" y="68" font-family="JetBrains Mono, monospace" font-size="34" font-weight="700" fill="#5A7A8A" text-anchor="middle" dominant-baseline="middle">
      Приветствуем на странице нашей команды.
      
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#5A7A8A;#8FA4B5;#5A7A8A" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Усиленное свечение для первой строки -->
  <g filter="url(#glowLetterStrong)">
    <text x="650" y="68" font-family="JetBrains Mono, monospace" font-size="34" font-weight="700" fill="#5A7A8A" text-anchor="middle" dominant-baseline="middle" opacity="0">
      Приветствуем на странице нашей команды.
      
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="fill" values="#5A7A8A;#8FA4B5;#5A7A8A" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Вторая строка текста (тот же цвет) -->
  <g filter="url(#glowLetter)">
    <text x="650" y="108" font-family="JetBrains Mono, monospace" font-size="34" font-weight="700" fill="#5A7A8A" text-anchor="middle" dominant-baseline="middle">
      Мы necoStydio и скоро здесь появятся классные игры.
      
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="fill" values="#5A7A8A;#8FA4B5;#5A7A8A" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </text>
  </g>
  
  <!-- Усиленное свечение для второй строки -->
  <g filter="url(#glowLetterStrong)">
    <text x="650" y="108" font-family="JetBrains Mono, monospace" font-size="34" font-weight="700" fill="#5A7A8A" text-anchor="middle" dominant-baseline="middle" opacity="0">
      Мы necoStydio и скоро здесь появятся классные игры.
      
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="fill" values="#5A7A8A;#8FA4B5;#5A7A8A" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </text>
  </g>
</svg>
